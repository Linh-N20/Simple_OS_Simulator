name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build the kernel
        run: make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-binary
          path: os
          if-no-files-found: error

  # These scenarios are deterministic (single CPU / fixed dispatch order),
  # so their output is expected to match output/*.output exactly.

  exact-match-tests:
    name: Exact-match tests
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - os_sc
          - os_syscall_list
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build the kernel
        run: make

      - name: Run scenario
        run: ./os "${{ matrix.scenario }}" | tee "${{ matrix.scenario }}.output"

      - name: Diff against expected output
        run: diff -u --strip-trailing-cr "output/${{ matrix.scenario }}.output" "${{ matrix.scenario }}.output"

      - name: Upload actual output (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: actual-output-${{ matrix.scenario }}
          path: ${{ matrix.scenario }}.output

  # These scenarios involve concurrent multi-CPU scheduling and/or dynamically
  # allocated memory addresses, so their exact output legitimately varies
  # between runs (see report Section 8 comparisons). 
  # We just verify the run completes cleanly and keep the output as an artifact 
  # for manual review, rather than failing the build on a non-deterministic diff.
  
  trace-tests:
    name: Trace tests (non-deterministic, informational)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - os_0_mlq_paging
          - os_1_mlq_paging
          - os_1_mlq_paging_small_1K
          - os_1_mlq_paging_small_4K
          - os_1_singleCPU_mlq
          - os_1_singleCPU_mlq_paging
          - os_2_mlq_paging
          - os_2_singleCPU_mlq_paging
          - os_syscall
          - sched
          - sched_0
          - sched_1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build the kernel
        run: make

      - name: Run scenario
        run: ./os "${{ matrix.scenario }}" | tee "${{ matrix.scenario }}.output"

      - name: Upload output for manual comparison
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.scenario }}
          path: ${{ matrix.scenario }}.output